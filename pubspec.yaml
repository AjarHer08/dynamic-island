name: dynamic_island
description: Dynamic Island desktop overlay for Windows & Linux (4GB RAM / Intel HD optimised).
publish_to: 'none'
version: 1.1.8+12

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  dbus: ^0.7.10
  window_manager: ^0.4.2
  screen_retriever: ^0.2.0
  tray_manager: ^0.2.3
  shared_preferences: ^2.2.3
  http: ^1.2.1
  ffi: ^2.1.0
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/